name: Validate workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON, node names and secrets
        run: python scripts/validate_workflows.py
      - name: README index is up to date
        run: |
          python scripts/validate_workflows.py --index
          git diff --exit-code README.md || (echo "Run: python scripts/validate_workflows.py --index" && exit 1)
